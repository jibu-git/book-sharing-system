services:
  mysql:
    image: mysql:8.0
    container_name: ry-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ry
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: ry-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ry-backend
    environment:
      DB_USERNAME: root
      DB_PASSWORD: 123456
      TOKEN_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - upload-data:/home/ruoyi/uploadPath
    restart: unless-stopped

  nginx:
    build:
      context: ./shuyi-ui
      dockerfile: Dockerfile
    container_name: ry-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  upload-data: